[project]
name = "lumber"
version = "0.1.0"
description = "Optimize lumber usage: rip to width, cut to length"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "reportlab>=5.0.0",
    "rich>=13.0",
]

[project.scripts]
lumber = "lumber.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumber"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
packages = ["lumber"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
